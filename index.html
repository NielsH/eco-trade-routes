<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Route Planner</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2126; --muted: #5d6670; --line: #e2e0d8; --hover: #f1efe8; --field: #fbfaf7;
  --accent: #b5532a; --accent-soft: #f6e3d9; --good: #2f7d4f; --bad: #b42318; --shop: #ffffff; --shop-ring: #1d2126;
  --closed: #9aa0a6; --route: #d9480f; --side: #7048e8; --start: #1c7ed6; --player: #e8590c; --map-bg: #6f6a5c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --panel: #1d2126; --ink: #e8e6e1; --muted: #9aa3ad; --line: #2e333a; --hover: #252a30; --field: #171a1e;
    --accent: #f08c5a; --accent-soft: #3a2a22; --good: #6fcf97; --bad: #ff8787; --shop: #1d2126; --shop-ring: #f5f3ee;
    --closed: #6b7178; --route: #ff8a4c; --side: #b197fc; --start: #4dabf7; --player: #ffa94d; --map-bg: #3a372f;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1d2126; --ink: #e8e6e1; --muted: #9aa3ad; --line: #2e333a; --hover: #252a30; --field: #171a1e;
  --accent: #f08c5a; --accent-soft: #3a2a22; --good: #6fcf97; --bad: #ff8787; --shop: #1d2126; --shop-ring: #f5f3ee;
  --closed: #6b7178; --route: #ff8a4c; --side: #b197fc; --start: #4dabf7; --player: #ffa94d; --map-bg: #3a372f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sub { color: var(--muted); font-size: 12px; }
button { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.on { background: var(--start); border-color: var(--start); color: #fff; }
input, select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
.box { padding: 8px 14px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row + .row { margin-top: 6px; }
.lbl { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.grid label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 2px; }
.grid input, .grid select { width: 100%; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.startinfo { font-size: 13px; }
.startinfo b { color: var(--start); }
.moved { margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
.tabs button { flex: 1; border-radius: 6px 6px 0 0; border-bottom: none; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.filter { padding: 6px 12px; border-top: 1px solid var(--line); }
.filter input { width: 100%; }
.list { overflow-y: auto; flex: 1; min-height: 0; }
.item { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--hover); }
.item.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); cursor: default; }
.item .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.big { font-weight: 600; font-variant-numeric: tabular-nums; }
.rate { color: var(--good); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.path { color: var(--muted); font-size: 12px; margin-top: 2px; }
.steps { margin: 8px 0 4px; }
.stop { border-left: 3px solid var(--leg, var(--line)); margin-left: 8px; padding: 0 0 6px 14px; }
.stop-head { display: flex; align-items: center; gap: 8px; margin-left: -24px; padding: 2px 0 4px; font-weight: 600; }
.stop-head .n { width: 18px; height: 18px; border-radius: 50%; background: #1d2126; border: 1.5px solid #fff; color: #fff; font-size: 11px; display: grid; place-items: center; flex: none; margin-left: 1px; }
.act { display: grid; grid-template-columns: 34px 52px 1fr auto; gap: 8px; align-items: baseline; padding: 2px 0; }
.act .verb { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.act.buy .verb { color: var(--start); }
.act.sell .verb { color: var(--good); }
.act .qty { font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.act .what { min-width: 0; }
.act .note { color: var(--side); font-size: 11px; margin-left: 4px; white-space: nowrap; }
.act .split { display: block; color: var(--side); font-size: 11px; }
.track { border-bottom: 1px solid var(--line); padding: 10px 14px; background: var(--accent-soft); display: none; }
.track.on { display: block; }
.track .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 600; }
.track .tstop { display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; align-items: start; padding: 3px 0; font-size: 12.5px; }
.track .tstop .mark { text-align: center; }
.track .tstop.done { color: var(--muted); }
.track .tstop .what { color: var(--muted); font-size: 11.5px; }
.track .warn { color: #d9822b; font-size: 12px; }
.track .bad { color: var(--bad); font-size: 12px; font-weight: 600; }
.track .okline { color: var(--good); font-size: 12px; }
.track button.tiny { padding: 1px 6px; font-size: 11px; }
.act .price { color: var(--muted); font-size: 11.5px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.drive { color: var(--muted); font-size: 12px; margin-left: 8px; padding: 3px 0 7px 14px; border-left: 3px solid var(--leg, var(--line)); }
.drive .legtag { color: var(--leg); font-weight: 700; }
.steps [data-leg] { cursor: default; }
.drive.start { border-left: 3px dashed var(--start); }
.steps .summary { color: var(--muted); font-size: 12px; padding: 4px 0 2px; }
.steps .summary b { color: var(--ink); }
main { position: relative; min-width: 0; min-height: 0; background: var(--map-bg); overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas.drag { cursor: grabbing; }
canvas.pick { cursor: crosshair; }
.tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.2); display: none; }
.coords { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.controls { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--start); color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 13px; display: none; }
.detail { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.detail h2 { font-size: 15px; margin: 0 0 2px; }
table.offers { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.offers th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 3px 4px; }
.offers td { padding: 3px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.offers .num { text-align: right; }
.empty, .status { color: var(--muted); padding: 14px; }
.err { color: var(--bad); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; }
  main { order: -1; }
  aside { border-right: none; border-top: 1px solid var(--line); }
  .grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Trade routes <span class="row"><button id="refresh" title="Reload shops, players and map">Refresh</button><button id="theme" title="Light/dark">◐</button></span></h1>
      <div class="sub" id="status">Loading…</div>
    </header>
    <div class="box">
      <div class="row startinfo"><span class="lbl">Start:</span> <span id="startText">anywhere</span></div>
      <div class="row">
        <button id="pick">Pick on map</button>
        <select id="player" title="Start from an online player's position"><option value="">Player…</option></select>
        <button id="clearStart">Anywhere</button>
      </div>
      <details id="settingsBox">
        <summary>Vehicle, cash and planning settings</summary>
        <div class="grid">
          <label style="grid-column: span 2">Vehicle<select id="vehicle"></select></label>
          <label style="grid-column: span 2" title="Bring a boat too: routes can switch between land and water at any shore, carrying the other vehicle along">Boat for water crossings<select id="boat"></select></label>
          <label>Slots<input id="slots" type="number" min="1"></label>
          <label>Max kg<input id="maxkg" type="number" min="1"></label>
          <label>Speed<input id="speed" type="number" min="1" step="0.5"></label>
          <label>Cash (blank = ∞)<input id="cash" type="number" min="0" placeholder="∞"></label>
          <label>Max legs<input id="legs" type="number" min="1" max="8"></label>
          <label>Min legs<input id="minLegs" type="number" min="1" max="8"></label>
          <label style="grid-column: span 2">Currency<select id="currency"></select></label>
          <label>Stop min<input id="stopMin" type="number" min="0" step="0.5"></label>
          <label title="Minutes to pack up one vehicle, place the other and move the cargo across, each time a route switches between land and boat">Switch min<input id="switchMin" type="number" min="0" step="0.5"></label>
          <label>Road factor<input id="routeFactor" type="number" min="1" step="0.1"></label>
          <label>Bonus %<input id="bonus" type="number" min="0" step="1"></label>
          <label style="grid-column: span 2">Travel time<select id="routing"><option value="terrain">routed over roads and terrain</option><option value="straight">straight line x road factor</option></select></label>
          <label>Off-road speed<input id="offroad" type="number" min="0.05" max="1" step="0.05" title="Speed off roads, relative to the same ground on a road (trees, rocks, bumps)"></label>
          <label>Off-road gap<input id="stretch" type="number" min="0" step="10" title="Longest stretch without a road a route may cross at normal off-road speed, in blocks. Farther from any road or town it's 10x slower, so routes stick to roads."></label>
        </div>
        <div class="sub" id="cargoNote" style="margin-top:4px"></div>
      </details>
    </div>
    <div class="track" id="track"></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="runs" aria-selected="true">Runs</button>
      <button role="tab" data-tab="deals" aria-selected="false">Direct deals</button>
      <button role="tab" data-tab="shops" aria-selected="false">Shops</button>
    </div>
    <div class="filter"><input id="q" type="search" placeholder="Filter by item or shop"></div>
    <div class="list" id="list"><div class="status">Loading…</div></div>
  </aside>
  <main>
    <canvas id="map"></canvas>
    <div class="banner" id="banner">Click the map to set your start</div>
    <div class="tip" id="tip"></div>
    <div class="coords" id="coords">x –, z –</div>
    <div class="controls"><button id="fit">Reset view</button></div>
  </main>
</div>
<script src="vehicles.js"></script>
<script src="terrain-colors.js"></script>
<script src="routing.js"></script>
<script>
"use strict";
//vehicles.js (tools/build_catalog.py) defines window.VEHICLES; the fallback keeps the page usable without it.
const VEHICLES = window.VEHICLES || { PoweredCart: { slots: 18, maxWeightKg: 3500, speed: 12, water: false } };
const params = new URLSearchParams(location.search);
const SERVER = (params.get("server") || "https://play.factoreco.org").replace(/\/$/, "");
const API = SERVER + "/api/v1/plugins/RecipeApi";
const W = 2000;
const $ = id => document.getElementById(id);
const fmt = (n, d = 1) => Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clean = s => String(s ?? "").replace(/<[^>]+>/g, "").trim() || "(unnamed)";
const pretty = n => String(n ?? "").replace(/Item$/, "").replace(/([a-z])([A-Z])/g, "$1 $2");
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get(k, d) { try { const v = localStorage.getItem("trade." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("trade." + k, JSON.stringify(v)); } catch (e) {} } };

// ---------------- state ----------------
let SHOPS = [], BYID = {}, ITEMS = {}, PLAYERS = [], RUNS = [], DEALS = [], M = null;
let LIVE_VEHICLES = null;   // /vehicles: placed vehicles with real cargo storage; null on servers without the route
let start = store.get("start", null);   // null | {kind:"pos", x, z, label} | {kind:"shop", id} | {kind:"player", name}
let tab = "runs", selected = null, hoverShop = null, hoverLeg = null, picking = false, loadedAt = null;
// Trades of runs you finished ("Continue from"), kept until fresh data shows them: the server caches /shops for up to
// 60 s, so a sale from seconds ago can still be missing. DONE is the part not visible yet, subtracted while planning.
let TRADES = { sells: {}, buys: {}, money: {}, stored: {} }, DONE = { sold: {}, bought: {}, money: {}, stored: {} }, tradeCheck = null;
const TRADE_TTL_MS = 3 * 60 * 1000;   // well past the server's 60 s cache: by then fresh data must include the trade
const S = {};                            // settings, read from the form

// ---------------- data ----------------
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url.replace(SERVER, "")} → HTTP ${r.status}`);
  return r.json();
}
const norm = t => String(t || "").replace(/\s/g, "").toLowerCase();

async function load() {
  $("status").textContent = "Loading shops, items and players…";
  try {
    const [shops, items, players, vehicles] = await Promise.all([
      getJSON(API + "/shops"), getJSON(API + "/items"),
      getJSON(API + "/players").catch(() => ({ Players: null })),   // older RecipeApi without /players
      getJSON(API + "/vehicles").catch(() => ({ Vehicles: null })), // older RecipeApi without /vehicles
    ]);
    ITEMS = {};
    for (const i of items.Items) ITEMS[i.Item] = { weightKg: i.Weight / 1000, stackSize: i.MaxStackSize, carried: i.Carried, name: i.Name, tags: i.Tags };
    // Tag -> items. Exact from /items Tags; older servers: /tags (display names), matched loosely.
    const tagIndex = {};
    if (items.Items.length && items.Items[0].Tags) {
      for (const i of items.Items) for (const t of i.Tags) (tagIndex[norm(t)] ||= []).push(i.Item);
    } else {
      const byName = Object.fromEntries(items.Items.map(i => [i.Name, i.Item]));
      let tags = null;
      for (const u of ["/tags?all=true", "/tags"]) { try { tags = (await getJSON(API + u)).Tags; break; } catch (e) {} }
      if (tags) for (const it of Object.values(ITEMS)) it.tags = [];   // tag data loaded: an item in no list has no (listed) tags
      for (const [t, names] of Object.entries(tags || {})) {
        tagIndex[norm(t)] = names.map(n => byName[n]).filter(Boolean);
        for (const type of tagIndex[norm(t)]) (ITEMS[type].tags ||= []).push(t);   // items get their tags from the same data
      }
    }
    SHOPS = shops.Shops.filter(s => !s.Error).map(s => ({
      id: s.Id, name: clean(s.Name), owner: s.Owner, x: s.Position.X, z: s.Position.Z, position: { x: s.Position.X, z: s.Position.Z },
      on: s.On, enabled: s.Enabled, currency: s.Currency, balance: s.UnlimitedBalance ? "infinite" : s.Balance, emptySlots: s.EmptySlots,
      sells: s.Sells.map((o, n) => ({ key: `${s.Id}/s${n}`, item: o.Item, tag: o.Tag, price: o.Price, quantity: o.Available, limit: o.Limit })),
      buys: s.Buys.map((o, n) => ({
        key: `${s.Id}/b${n}`, item: o.Item, tag: o.Tag, price: o.Price, limit: o.Limit,
        tagItems: o.Item ? null : (tagIndex[norm(o.Tag)] || []),
        quantity: o.CanAccept ?? 999, unlimited: o.Wanted == null, wanted: o.Wanted, canAfford: o.CanAfford, canStore: o.CanStore, canStoreItems: o.CanStoreItems || null,
      })),
    }));
    BYID = Object.fromEntries(SHOPS.map(s => [s.id, s]));
    PLAYERS = players.Players;
    anchorPlayerStart();
    LIVE_VEHICLES = vehicles.Vehicles && vehicles.Vehicles.filter(v => !v.Error);
    const previousData = loadedAt;
    loadedAt = shops.GeneratedAt;
    fillCurrencies(); fillPlayers(); fillVehicles();
    tradeCheck = reconcile(previousData === loadedAt);
    replan();
  } catch (e) {
    $("status").innerHTML = `<span class="err">Could not load from ${esc(SERVER)}: ${esc(e.message)}</span>`;
    $("list").innerHTML = `<div class="status err">${esc(e.message)}</div>`;
  }
}

// ---------------- finished runs vs fresh data ----------------
// Records a finished run's trades with the numbers the page had when it was planned (call before reloading).
function recordTrades(r) {
  const now = Date.now(), legs = [...r.legs, ...r.side];
  for (const leg of legs) for (const l of leg.load) {
    const so = BYID[leg.from].sells.find(o => o.item === l.item && o.quantity > 0 && o.price >= 0);   // the offer the planner used
    const sk = leg.from + "|" + l.item;
    TRADES.sells[sk] ||= { shop: leg.from, item: l.item, qty: 0, before: so ? so.quantity : 0, at: now };
    TRADES.sells[sk].qty += l.qty;
    const bo = BYID[leg.to].buys.find(o => o.key === l.offer);
    if (bo && !(bo.quantity === 999 && !bo.limit)) {   // an offer without a limit has no demand to use up
      TRADES.buys[l.offer] ||= { shop: leg.to, key: l.offer, item: bo.item, tag: bo.tag, qty: 0, before: bo.quantity, at: now };
      TRADES.buys[l.offer].qty += l.qty;
    }
  }
  for (const leg of legs) {
    const x = TRADES.stored[leg.to] ||= { shop: leg.to, items: {}, freeBefore: freeSlots(BYID[leg.to]), at: now };
    for (const l of leg.load) x.items[l.item] = (x.items[l.item] || 0) + l.qty;
  }
  for (const leg of legs) {
    if (BYID[leg.to].balance === "infinite") continue;
    TRADES.money[leg.to] ||= { shop: leg.to, amount: 0, before: BYID[leg.to].balance || 0, at: now };
    TRADES.money[leg.to].amount += leg.revenue;
  }
}
// After a reload: whatever the server already shows is taken as-is; only the rest stays in DONE. Trades fully visible, or
// older than TRADE_TTL_MS, are forgotten. Approximate when other players trade at the same shops in between.
function reconcile(sameData) {
  const done = { sold: {}, bought: {}, money: {}, stored: {} }, now = Date.now();
  let seen = 0, total = 0;
  const unseen = (qty, before, after) => qty - Math.max(0, Math.min(qty, before - after));
  for (const [k, x] of Object.entries(TRADES.sells)) {
    const so = BYID[x.shop]?.sells.find(o => o.item === x.item && o.price >= 0);
    const left = so ? unseen(x.qty, x.before, so.quantity) : 0;
    total++; if (left <= 0) seen++;
    if (left > 0 && now - x.at < TRADE_TTL_MS) done.sold[k] = left; else delete TRADES.sells[k];
  }
  for (const [k, x] of Object.entries(TRADES.buys)) {
    const offers = BYID[x.shop]?.buys || [], bo = offers.find(o => o.key === k && o.item === x.item && o.tag === x.tag) || offers.find(o => o.item === x.item && o.tag === x.tag);
    const left = bo ? unseen(x.qty, x.before, bo.quantity) : 0;   // offer gone: nothing left to subtract
    total++; if (left <= 0) seen++;
    if (left > 0 && now - x.at < TRADE_TTL_MS) done.bought[bo.key] = left; else delete TRADES.buys[k];
  }
  for (const [k, x] of Object.entries(TRADES.money)) {
    const bal = BYID[x.shop]?.balance;
    const left = bal == null || bal === "infinite" ? 0 : x.amount - Math.max(0, Math.min(x.amount, x.before - bal));
    if (left > 0.01 && now - x.at < TRADE_TTL_MS) done.money[k] = left; else delete TRADES.money[k];
  }
  for (const [k, x] of Object.entries(TRADES.stored)) {   // the share of our slots the fresh free-slot count doesn't show yet
    const s = BYID[x.shop], slots = s ? slotsFor(x.items) : 0, now_ = s ? freeSlots(s) : null;
    const left = now_ == null || !slots ? 0 : 1 - Math.max(0, Math.min(slots, x.freeBefore - now_)) / slots;
    if (left > 0.01 && now - x.at < TRADE_TTL_MS) done.stored[k] = Object.fromEntries(Object.entries(x.items).map(([i, q]) => [i, Math.ceil(q * left)]));
    else delete TRADES.stored[k];
  }
  DONE = done;
  return total ? { seen, total, sameData } : null;
}

// ---------------- planner (port of plan_routes.py) ----------------
function dist(a, b) {
  let dx = Math.abs(a.x - b.x), dz = Math.abs(a.z - b.z);
  if (S.wrap) { dx = Math.min(dx, W - dx); dz = Math.min(dz, W - dz); }
  return Math.hypot(dx, dz);
}
const minutes = (a, b) => dist(a, b) * S.routeFactor / S.speed / 60;
// Routed travel times (routing.js): shop to shop for the open shops of the current market (ROUTE), and from the start
// (START_ROW, a single cheap search, so moving the start doesn't redo the matrix). Straight-line times until they land.
let ROUTE = null, START_ROW = null, routeWanted = null, rowWanted = null, routeProgress = null, routesOn = false, rowOn = false;

    if (selected?.kind === "shop" && BYID[selected.id]) html += shopDetail(BYID[selected.id]);
    SHOPS.filter(s => !q || (s.name + " " + (s.owner || "") + " " + s.sells.concat(s.buys).map(o => pretty(o.item || o.tag)).join(" ")).toLowerCase().includes(q))
      .sort((a, b) => (b.on && b.enabled) - (a.on && a.enabled) || a.name.localeCompare(b.name))
      .forEach(s => {
        if (selected?.kind === "shop" && selected.id === s.id) return;
        html += `<div class="item" data-kind="shop" data-id="${s.id}"><div class="top"><span class="big">${esc(s.name)}</span>
          <span class="rate" style="color:${s.on && s.enabled ? "var(--good)" : "var(--muted)"}">${s.on && s.enabled ? "open" : "closed"}</span></div>
          <div class="path">${esc(s.owner)} · ${esc(s.currency || "barter")} · money ${s.balance === "infinite" ? "∞" : fmt(s.balance ?? 0)}</div></div>`;
      });
  }
  list.innerHTML = html;
  list.querySelectorAll(".item").forEach(el => el.onclick = ev => {
    if (ev.target.closest("button")) return;
    const k = el.dataset.kind;
    if (k === "shop") return showShop(el.dataset.id);
    const i = +el.dataset.i;
    if (selected?.kind === k && selected.i === i) return;
    selected = { kind: k, i }; render(); draw();
  });
  list.querySelectorAll(".steps [data-leg]").forEach(el => {   // hovering a stop or drive picks out its leg on the map
    el.onmouseenter = () => { hoverLeg = +el.dataset.leg; draw(); };
    el.onmouseleave = () => { hoverLeg = null; draw(); };
  });
  hoverLeg = null;
  list.querySelectorAll("[data-track]").forEach(b => b.onclick = () => startTracking(RUNS[+b.dataset.track]));
  list.querySelectorAll("[data-continue]").forEach(b => b.onclick = async () => {
    const r = RUNS[+b.dataset.continue];
    if (TRACK) stopTracking();   // the run is done
    recordTrades(r);   // against the numbers this run was planned on, before they're replaced
    if (S.cash !== Infinity) { $("cash").value = Math.floor(S.cash + r.profit); saveForm(); }
    start = { kind: "shop", id: r.path[r.path.length - 1] }; store.set("start", start);
    picking = false; updatePickUi();
    loadMap(); await load();   // you just traded: plan the next run on fresh data
  });
  list.querySelectorAll("[data-start]").forEach(b => b.onclick = () => setStart({ kind: "shop", id: b.dataset.start }));
}
// A run as instructions: at each stop what to sell and what to buy (quantity first), then the drive to the next stop.
// Per stop of a run: what to sell (per buy offer) and what to buy, one line per item with its total and how it splits
// over the stops it's for (parts), so at the counter you just buy the total.
function runStops(r) {
  const stops = r.path.map(() => ({ sell: [], buy: [] }));
  const buy = (k, l, to) => {
    let m = stops[k].buy.find(b => b.item === l.item);
    if (!m) stops[k].buy.push(m = { item: l.item, buy: l.buy, unknown: l.unknown, qty: 0, parts: [] });
    m.qty += l.qty; m.parts.push({ qty: l.qty, to, viaTag: l.viaTag });
  };
  r.legs.forEach((leg, k) => leg.load.forEach(l => { buy(k, l, k + 1); stops[k + 1].sell.push(l); }));
  r.side.forEach(sd => sd.load.forEach(l => { buy(sd.fromStop, l, sd.toStop); stops[sd.toStop].sell.push(l); }));
  for (const s of stops) for (const b of s.buy) b.parts.sort((x, y) => x.to - y.to);
  return stops;
}
function runCard(r) {
  const stops = runStops(r);
  let bal = 0, need = 0;   // cash needed up front: sales at a stop come before its purchases
  for (const s of stops) { for (const l of s.sell) bal += l.qty * l.sell * (1 + S.bonus); for (const l of s.buy) bal -= l.qty * l.buy; need = Math.max(need, -bal); }
  const line = (verb, l, k) => {
    const price = verb === "buy" ? l.buy : l.sell, notes = [];
    let split = "";
    if (verb === "sell" && l.viaTag) notes.push("as " + esc(l.viaTag));
    if (verb === "buy") {
      const part = p => (p.to > k + 1 ? "for stop " + (p.to + 1) : "for the next stop") + (p.viaTag ? " as " + esc(p.viaTag) : "");
      if (l.parts.length > 1) split = `<span class="split">${l.parts.map(p => `${fmt(p.qty, 0)} ${part(p)}`).join(" · ")}</span>`;
      else if (l.parts[0].to > k + 1 || l.parts[0].viaTag) notes.push(part(l.parts[0]).replace("for the next stop as", "as"));
    }
    if (l.unknown) notes.push("⚠ no item data");
    return `<div class="act ${verb}"><span class="verb">${verb}</span><span class="qty">${fmt(l.qty, 0)}</span>` +
      `<span class="what">${esc(pretty(l.item))}${notes.map(n => `<span class="note">${n}</span>`).join("")}${split}</span>` +
      `<span class="price">${fmt(price, 2)} ea · ${fmt(l.qty * price)}</span></div>`;
  };
  const roadText = (a, b) => {
    const p = S.routing === "terrain" && !S.water && PATHS.get(JSON.stringify([routeParams(), Math.round(a.x), Math.round(a.z), Math.round(b.x), Math.round(b.z)]));
    if (!p || !p.points) return "";
    const boat = p.boatShare > 0 ? ` · ⛵ ${Math.round(p.boatShare * 100)}% by boat` + (p.switches ? `, ${p.switches} switch${p.switches > 1 ? "es" : ""}` : "") : "";
    return (p.boatShare < 1 ? ` · ${Math.round(p.onRoad * 100)}% road` : "") + boat +
      (p.offroadBlocks > S.stretch ? ` · <span class="err">${fmt(p.offroadBlocks, 0)} blocks without a road</span>` : "");
  };
  let html = `<div class="steps">`;
  if (r.lead > 0.05) html += `<div class="drive start">Drive to the first stop · ${fmt(r.lead)} min${roadText(startPosition(), BYID[r.path[0]])}</div>`;
  r.path.forEach((id, k) => {
    const leg = r.legs[k], legAttr = leg ? ` data-leg="${k}" style="--leg:${legColor(k)}"` : "";
    html += `<div class="stop"${legAttr}><div class="stop-head"><span class="n">${k + 1}</span>${shopName(id)}</div>` +
      stops[k].sell.map(l => line("sell", l, k)).join("") + stops[k].buy.map(l => line("buy", l, k)).join("") + `</div>`;
    if (leg) html += `<div class="drive"${legAttr}><span class="legtag">→ ${k + 2}</span> · ${fmt(leg.minutes - S.stopMinutes)} min${roadText(BYID[leg.from], BYID[leg.to])} · cargo ${leg.slots}/${S.slots} slots, ${fmt(leg.w, 0)} kg</div>`;
  });
  html += `<div class="summary">Profit <b>+${fmt(r.profit)} ${esc(S.currency)}</b> · ${fmt(r.minutes)} min incl. ${fmt(S.stopMinutes)} min per stop · needs <b>${fmt(need)}</b> cash up front</div></div>`;
  return html;
}
function shopDetail(s) {
  const rows = (offers, buy) => offers.map(o => `<tr><td>${esc(pretty(o.item) || ("any " + o.tag))}</td><td class="num">${fmt(o.price, 2)}</td>
    <td class="num">${buy ? (o.quantity === 999 && o.unlimited ? "any" : fmt(o.quantity, 0)) : fmt(o.quantity, 0)}</td></tr>`).join("");
  return `<div class="detail"><h2>${esc(s.name)}</h2>
    <div class="sub">${esc(s.owner)} · ${s.on && s.enabled ? "open" : "closed"} · ${esc(s.currency || "barter")} · money ${s.balance === "infinite" ? "∞" : fmt(s.balance ?? 0)} · x ${Math.round(s.x)}, z ${Math.round(s.z)}</div>
    ${s.emptySlots ? `<div class="sub">Empty storage slots: ${s.emptySlots.Carried} for carried items (logs, lumber, …) · ${s.emptySlots.NonCarried} for other items · ${s.emptySlots.Either} for either</div>` : ""}
    <div class="row" style="margin-top:6px"><button class="primary" data-start="${s.id}">Start here</button></div>
    <table class="offers"><tr><th>Sells</th><th class="num">price</th><th class="num">stock</th></tr>${rows(s.sells, false) || '<tr><td colspan="3">—</td></tr>'}</table>
    <table class="offers"><tr><th>Buys</th><th class="num">price</th><th class="num">can take</th></tr>${rows(s.buys, true) || '<tr><td colspan="3">—</td></tr>'}</table></div>`;
}
function showShop(id) { selected = { kind: "shop", id }; if (tab !== "shops") selectTab("shops"); else render(); $("list").scrollTop = 0; draw(); }

// ---------------- boot ----------------
initForm();
new ResizeObserver(resize).observe(cv);
loadMap(); load();
startPlayerPoll();
if (TRACK) { renderTrack(); checkTrack(); scheduleTrack(); }
$("refresh").addEventListener("click", loadMap);
</script>
